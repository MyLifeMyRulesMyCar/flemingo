openapi: 3.0.3
info:
  title: Flemingo API
  version: 0.14.0
  description: "Auto-generated from api/app.py's live url_map \u2014 do not hand-edit paths/security here,\
    \ edit PATHS_DETAIL in scripts/generate_openapi_stub.py and regenerate instead."
servers:
- url: https://{device-ip}
  description: Device (TLS)
tags:
- name: auth_api
- name: can_api
- name: health_api
- name: io_api
- name: modbus_api
- name: modbus_tcp_api
- name: mqtt_api
- name: network_api
- name: status
- name: system_api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Role scopes used loosely here for documentation: viewer < operator < admin. Flemingo\
        \ does not do real OAuth2 scope checking \u2014 this just documents which @require_role the endpoint\
        \ carries."
paths:
  /api/auth/change-password:
    post:
      operationId: auth_api_change_password
      summary: Change the current user's password
      tags:
      - auth_api
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - old_password
              - new_password
              properties:
                old_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
      responses:
        '200':
          description: "Password changed \u2014 re-login for new tokens"
        '400':
          description: Missing fields, or new_password fails policy
        '401':
          description: old_password incorrect, or bad access token
  /api/auth/login:
    post:
      operationId: auth_api_login
      summary: Log in and receive access + refresh tokens
      tags:
      - auth_api
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  user:
                    type: object
                  warning:
                    type: string
                    description: Present if must_change_password is set
        '400':
          description: username and password are required
        '401':
          description: Invalid credentials
        '429':
          description: "Too many failed attempts \u2014 rate limited"
  /api/auth/logout:
    post:
      operationId: auth_api_logout
      summary: "Log out \u2014 best-effort revoke of the supplied refresh token"
      tags:
      - auth_api
      security:
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Logged out
        '401':
          description: Missing or invalid access token
  /api/auth/me:
    get:
      operationId: auth_api_me
      summary: Current user's decoded token payload
      tags:
      - auth_api
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                  role:
                    type: string
                    enum:
                    - viewer
                    - operator
                    - admin
                  must_change_password:
                    type: boolean
        '401':
          description: Missing or invalid access token
  /api/auth/refresh:
    post:
      operationId: auth_api_refresh
      summary: Exchange a refresh token for a new access token
      tags:
      - auth_api
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
        '400':
          description: refresh_token is required
        '401':
          description: Invalid or expired refresh token
  /api/auth/users:
    get:
      operationId: auth_api_list_users
      summary: List all users
      tags:
      - auth_api
      security:
      - bearerAuth:
        - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or invalid access token
        '403':
          description: 'Requires role: admin'
    post:
      operationId: auth_api_create_user
      summary: Create a new user
      tags:
      - auth_api
      security:
      - bearerAuth:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              - role
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                role:
                  type: string
                  enum:
                  - viewer
                  - operator
                  - admin
      responses:
        '201':
          description: User created
        '400':
          description: Missing field or invalid role
        '401':
          description: Missing or invalid access token
        '403':
          description: 'Requires role: admin'
        '409':
          description: Username already exists
  /api/auth/users/{username}:
    delete:
      operationId: auth_api_delete_user
      summary: Delete a user (cannot delete your own account)
      tags:
      - auth_api
      security:
      - bearerAuth:
        - admin
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User deleted
        '400':
          description: Cannot delete your own account
        '401':
          description: Missing or invalid access token
        '403':
          description: 'Requires role: admin'
        '404':
          description: User not found
